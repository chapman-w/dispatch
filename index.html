  const row=(title,sub,inner)=>{const r=el("div",{class:"srow"},`<div class="hd"><span class="lab">${title}</span><span class="eyebrow">${sub}</span></div>`);r.append(inner);return r;};
  const opts=(vals,cur,on)=>{const w=el("div",{class:"opts-h"});vals.forEach(([val,lab,col])=>{const b=el("button",{"aria-pressed":String(Array.isArray(cur)?cur.includes(val):val===cur),style:col?`--c:${col}`:""},(col?"<i></i>":"")+lab);b.onclick=()=>{haptic();sfx("tick");on(val);};w.append(b);});return w;};
  const rerender=()=>{const st=$("#v-you").scrollTop;renderYou();$("#v-you").scrollTop=st;};
  const nm=el("input",{class:"field",id:"nameInput",maxlength:"24",placeholder:"Your name, for the share card",autocomplete:"off"});nm.value=S.name||"";
  nm.addEventListener("change",()=>{S.name=nm.value.trim();save();rerender();});
  set.append(row("Name","Profile and share card",nm));
  const sw=el("div",{class:"swatches"});
  Object.entries(PALETTES).forEach(([k,p])=>{const t=P_SHOW(p);const b=el("button",{class:"sw","aria-pressed":String(S.prefs.pal===k)},`<span class="chipz"><i style="background:${t.paper}"></i><i style="background:${t.accent}"></i><i style="background:${t.ink}"></i></span><span>${p.name}</span>`);b.onclick=()=>{haptic("medium");sfx("tick");S.prefs.pal=k;save();applyPrefs();renderCover();rerender();};sw.append(b);});
  set.append(row("Colour palette","Seven looks",sw));
  const ty=el("div",{class:"types"});
  Object.entries(FONTS).forEach(([k,f])=>{const b=el("button",{"aria-pressed":String(S.prefs.font===k)},`<span class="aa" style="font-family:${f.fam};font-weight:${f.wt};font-stretch:${f.st};text-transform:${f.cs};letter-spacing:${f.tr}">${f.cs==="uppercase"?"AA":"Aa"}</span><span class="tn">${f.name}</span>`);b.onclick=()=>{haptic("medium");sfx("tick");S.prefs.font=k;save();applyPrefs();renderedEd=null;rerender();};ty.append(b);});
  set.append(row("Title font","Headlines and numbers",ty));
  set.append(row("Reading font","Story text",opts(Object.entries(READS).map(([k,r])=>[k,r.name]),S.prefs.read,v=>{S.prefs.read=v;save();applyPrefs();rerender();})));
  set.append(row("Globe style","Map dots everywhere",opts([["dot","Dots"],["pixel","Pixels"],["halftone","Halftone"]],S.prefs.globe,v=>{S.prefs.globe=v;save();redrawPlates();rerender();})));
  set.append(row("Appearance","",opts([["system","System"],["light","Light"],["dark","Dark"]],S.prefs.theme,v=>{S.prefs.theme=v;save();applyPrefs();rerender();})));
  set.append(row("Reading size","",opts([["s","Small"],["m","Medium"],["l","Large"]],S.prefs.size,v=>{S.prefs.size=v;save();applyPrefs();rerender();})));
  set.append(row("Topics you follow","Starred on the cover",opts(Object.entries(INTERESTS).map(([k,t])=>[k,t.name,intColor(k)]),S.prefs.topics,v=>{const t=S.prefs.topics;S.prefs.topics=t.includes(v)?t.filter(x=>x!==v):[...t,v];save();renderCover();rerender();})));
  const tm=el("input",{class:"field timefield",type:"time","aria-label":"Edition time"});tm.value=S.prefs.time;
  tm.addEventListener("change",()=>{if(!/^\d\d:\d\d$/.test(tm.value))return;S.prefs.time=tm.value;save();nativeNotify(true);renderCover();toast("Edition arrives at "+tm.value);});
  set.append(row("Edition time","One notification a day, any time you like",tm));
  const tg=(key,title,sub)=>{const b=el("button",{class:"tgl",role:"switch","aria-checked":String(!!S.prefs[key])},`<span><span class="lab">${title}</span><p>${sub}</p></span><span class="swt"></span>`);b.onclick=()=>{S.prefs[key]=!S.prefs[key];save();haptic();sfx("tick");if(key==="explain")renderedEd=null;rerender();};const r=el("div",{class:"srow"});r.append(b);return r;};
  set.append(tg("explain","Explain as I read","Underline terms you can tap for a plain definition."));
  set.append(tg("sound","Sounds","Small clicks, stamps and chimes."));
  set.append(tg("haptics","Haptics","Taps and buzzes on your phone."));
  return set;
}

/* ----- prefs ----- */
function applyPrefs(){try{const SB=window.Capacitor?.Plugins?.StatusBar;if(SB)SB.setStyle({style:S.prefs.theme==="light"?"LIGHT":"DARK"});}catch(e){}

  const r=document.documentElement,P=PALETTES[S.prefs.pal]||PALETTES.signal;
  let mode=S.prefs.theme==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):S.prefs.theme;if(P.force)mode=P.force;
  const T=P[mode]||P.dark;
  r.dataset.theme=mode;r.dataset.size=S.prefs.size;
  const set=(k,v)=>r.style.setProperty(k,v);
  set("--paper",T.paper);set("--ink",T.ink);set("--mute",T.mute);set("--tint",T.tint);set("--accent",T.accent);set("--accent-ink",T.accentInk);set("--A",T.accent);set("--A-ink",T.accentInk);set("--P",T.paper);set("--I",T.ink);set("--sheet",T.sheet);
  set("--line",hexA(T.ink,.12));set("--line2",hexA(T.ink,.3));r.style.colorScheme=mode;
  const F=FONTS[S.prefs.font]||FONTS.dot;
  set("--display",`${F.fam},"Iowan Old Style",Georgia,"Helvetica Neue",serif`);set("--d-wt",F.wt);set("--d-st",F.st);set("--d-case",F.cs);set("--d-track",F.tr);set("--d-lh",F.lh);set("--d-scale",F.sc);
  set("--read",(READS[S.prefs.read]||READS.serif).fam);
  readColors();MONO_FONT=MONO();redrawPlates();fitPlaces();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitPlaces();MONO_FONT=MONO();});
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.prefs.theme==="system")applyPrefs();});

/* ----- intro + onboarding ----- */
function playIntro(){
  if(RM)return;const it=$("#intro");
  it.innerHTML=`<div class="m"><span>No. ${no3(LATEST.no)}</span><span>${short(LATEST.date)}</span></div><div class="w">${[..."Dispatch"].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join("")}</div><div class="m"><span>The world, daily</span><span>${S.name?"Hi, "+esc(S.name):LATEST.stories.length+" stories"}</span></div>`;
  it.hidden=false;const go=()=>{it.classList.add("out");setTimeout(()=>{it.hidden=true;it.classList.remove("out");},950);};
  const t=setTimeout(go,1400);it.onclick=()=>{clearTimeout(t);go();};
}
let ob={step:0,time:"07:00",explain:true,topics:[],name:"",goal:7};
function startOnboarding(){ob={step:0,time:S.prefs.time,explain:S.prefs.explain,topics:[...S.prefs.topics],name:S.name||"",goal:S.goal||7};$("#onb").hidden=false;renderOnb();}
function renderOnb(){
  const o=$("#onb"),st=ob.step,NS=4,OC=[null,CATS.Politics,CATS.Disaster,CATS.Society][st];
  o.style.setProperty("--oc",OC||"var(--A)");o.style.setProperty("--oc-ink",OC?catInk(OC):"var(--A-ink)");
  const steps=`<div class="steps">${[...Array(NS)].map((_,i)=>`<span class="${i<=st?"on":""}"></span>`).join("")}</div>`;
  let body="";
  if(st===0)body=`${plateHTML({lat:24,lon:30},{zoom:.46,oy:.5,pc:false,world:true,mono:true})}<h2 class="disp">The world in five minutes</h2><p>One short, colourful edition every morning. Seven stories explained from zero, then three quick questions.</p>`;
  if(st===1)body=`<span class="eyebrow">02 · Interests</span><h2 class="disp">What do you care about most?</h2><p>Pick any. We'll mark these stories on your cover, and you still get the full picture.</p><div class="choice">${Object.entries(INTERESTS).map(([k,t])=>`<button data-tp="${k}" aria-pressed="${ob.topics.includes(k)}">${t.name}<span>${ob.topics.includes(k)?"Following":""}</span></button>`).join("")}</div>`;
  if(st===2)body=`<span class="eyebrow">03 · Delivery</span><h2 class="disp">When should it land?</h2><p>Pick any time. You'll get one notification a day, and nothing else.</p><input class="field timefield" type="time" id="obTime" value="${ob.time}" aria-label="Delivery time"><div class="presets">${[["07:00","Morning"],["12:30","Lunch"],["18:00","Evening"]].map(([t,l])=>`<button data-t="${t}" aria-pressed="${ob.time===t}">${l}<span>${t}</span></button>`).join("")}</div>`;
  if(st===3)body=`<span class="eyebrow">04 · Ready</span><h2 class="disp">Your first edition is waiting</h2><p>It takes about five minutes. Tap any underlined word for a plain explanation.</p><input class="field" id="obName" maxlength="24" placeholder="Your first name (optional)" value="${esc(ob.name)}" autocomplete="off"><div class="btns"><button class="cta acc" id="obFresh"><span>Start reading</span><small>No. ${no3(LATEST.no)}</small></button><button class="ghost" id="obDemo"><span>Load demo history</span><small>for testing</small></button></div>`;
  const nav=st<NS-1?`<button class="cta${st===0?" acc":""}" id="obNext"><span>${st===0?"Get started":"Continue"}</span><small>${st+1} / ${NS}</small></button>`:"";
  o.innerHTML=steps+(st?`<span class="num" aria-hidden="true">0${st+1}</span>`:"")+`<div class="body2">${body}</div>`+nav;
  hydratePlates(o);
  o.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{haptic();sfx("tick");ob.time=b.dataset.t;renderOnb();});
  const tf=$("#obTime");if(tf)for(const ev of ["input","change"])tf.addEventListener(ev,()=>{if(/^\d\d:\d\d$/.test(tf.value)){ob.time=tf.value;o.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===ob.time));}});
  o.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{haptic();sfx("tick");ob.explain=b.dataset.e==="1";renderOnb();});
  o.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{haptic();sfx("tick");ob.name=($("#obName")?.value||"").trim();ob.goal=+b.dataset.g;renderOnb();});
  o.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{haptic();sfx("tick");const c=b.dataset.tp;ob.topics=ob.topics.includes(c)?ob.topics.filter(x=>x!==c):[...ob.topics,c];const on=ob.topics.includes(c);b.setAttribute("aria-pressed",on);b.querySelector("span").textContent=on?"Following":"";});
  const n=$("#obNext");if(n)n.onclick=()=>{haptic("medium");sfx("tick");ob.step++;renderOnb();};
  const fin=demo=>{haptic("success");sfx("level");const keep={...S.prefs};const nmv=($("#obName")?.value||"").trim();S=demo?demoState():defaults();Object.assign(S.prefs,keep,{time:ob.time,explain:ob.explain,topics:ob.topics.length||!demo?ob.topics:S.prefs.topics});if(nmv)S.name=nmv;if(!demo)S.goal=ob.goal;S.onboarded=true;save();nativeNotify(true);applyPrefs();renderedEd=null;renderAll();show("cover");o.hidden=true;toast(demo?"Demo history loaded":`Welcome${S.name?", "+S.name:""}`);};
  if(st===NS-1){$("#obFresh").onclick=()=>fin(false);$("#obDemo").onclick=()=>fin(true);}
}

/* check for a newer editions.json (published next to the app, or a hosted URL in the native build) */
const DATA_URL=window.DISPATCH_DATA_URL||"editions.json";
let lastCheck=0;
function checkEditions(){if(Date.now()-lastCheck<5*60*1000)return;lastCheck=Date.now();fetch(DATA_URL,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{
  if(!d||!Array.isArray(d.editions)||!d.editions.length||!(d.generatedAt>(DATA.generatedAt||"")))return;
  try{localStorage.setItem("dispatch.data",JSON.stringify(d));}catch(e){}try{const P=window.Capacitor?.Plugins?.Preferences;if(P)P.set({key:"dispatch.data",value:JSON.stringify(d)});}catch(e){}
  const fresh=d.editions[0].no!==LATEST.no;
  const bn=$("#banner");bn.innerHTML=`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="${C.accent}"/><text x="50" y="58" text-anchor="middle" font-family="Fragment Mono, monospace" font-size="22" fill="${C["accent-ink"]}">${no3(d.editions[0].no)}</text></svg><div><span>${fresh?"New edition":"Updated"} · tap to load</span><b>${fresh?"Edition No. "+no3(d.editions[0].no)+" is out":"Today's edition was updated"}</b></div>`;
  bn.classList.add("show");bn.style.cursor="pointer";bn.onclick=()=>location.reload();
}).catch(()=>{});}
setTimeout(checkEditions,2500);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkEditions();});
window.__dispatch={G,get S(){return S},show,openStory,startQuiz,openAtlas,openEdition,EDITIONS,frame,confetti,flushLevel,
  answer:k=>{const o=document.querySelector("#v-quiz .opts");o&&answer(k,o);},finish:()=>finish(),
  demo:()=>{S=demoState();S.onboarded=true;save();$("#onb").hidden=true;$("#intro").hidden=true;applyPrefs();renderedEd=null;renderAll();show("cover");},
  tab:t=>document.querySelector(`.tabs [data-tab=${t}]`).click(),
  pref:(k,v)=>{S.prefs[k]=v;applyPrefs();renderedEd=null;renderAll();},
  onbStep:n=>{startOnboarding();ob.step=n;renderOnb();}};
