# Re-runs the fact-checker on every push and pull request, so a bad edition can't reach the app.
name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd pipeline && node build.mjs --no-embed
